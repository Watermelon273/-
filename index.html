<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermelon273</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');

        :root {
            --mint-bg: #A3BEFD; 
            --pink-accent: #ff8fa3; 
            --rind-green: #2b9348; 
            --rind-light: #eaffea; 
            --seed-black: #2c2c2c;
            --white: #ffffff;
            --light-pink: #fff0f3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--mint-bg);
            color: var(--seed-black);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        /* Animated pixel-art watermelon background, fixed behind everything */
        .watermelon-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app-wrapper {
            display: none; /* shown by JS once logged in */
            gap: 25px;
            max-width: 950px;
            width: 100%;
            align-items: flex-start;
            margin-top: 60px; 
            position: relative;
            z-index: 1;
        }

        /* --- AUTH SCREEN --- */
        .auth-screen {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            margin: 100px auto;
            background-color: var(--white);
            border-radius: 25px;
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(43, 147, 72, 0.2);
            border: 3px solid var(--pink-accent);
            text-align: center;
        }

        .auth-screen h1 {
            color: var(--pink-accent);
            font-size: 1.9rem;
            margin-top: 0;
        }

        .auth-screen input[type="email"],
        .auth-screen input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 12px;
            border: 2px solid var(--mint-bg);
            border-radius: 15px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }
        .auth-screen input:focus { border-color: var(--rind-green); }

        .auth-submit-btn {
            width: 100%;
            background-color: var(--rind-green);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 4px;
        }
        .auth-submit-btn:hover { background-color: #1e7033; }
        .auth-submit-btn:active { transform: scale(0.98); }

        .auth-toggle {
            margin-top: 18px;
            font-size: 0.9rem;
            color: #666;
        }
        .auth-toggle a {
            color: var(--pink-accent);
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
        }
        .auth-toggle a:hover { text-decoration: underline; }

        .auth-error {
            color: #d63447;
            font-size: 0.88rem;
            font-weight: 700;
            min-height: 18px;
            margin-bottom: 8px;
        }

        .auth-loading {
            text-align: center;
            padding-top: 120px;
            font-weight: 800;
            color: var(--rind-green);
            position: relative;
            z-index: 1;
        }

        /* Logout button + user email pill */
        .account-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: -10px;
            padding-top: 5px;
        }
        .account-email {
            font-size: 0.85rem;
            font-weight: 700;
            color: #1e7033;
            background-color: var(--rind-light);
            padding: 5px 12px;
            border-radius: 12px;
        }
        .logout-btn {
            background-color: var(--light-pink);
            color: var(--pink-accent);
            border: 2px solid var(--pink-accent);
            padding: 5px 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .logout-btn:hover { background-color: var(--pink-accent); color: var(--white); }

        /* --- SIDEBAR CALENDAR STYLES --- */
        .sidebar {
            background-color: var(--white);
            width: 320px;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(43, 147, 72, 0.2);
            border: 3px solid var(--rind-green);
            flex-shrink: 0;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-header button {
            background: none;
            border: none;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--rind-green);
            cursor: pointer;
            padding: 5px 10px;
            transition: transform 0.2s;
        }
        
        .calendar-header button:hover {
            transform: scale(1.2);
            color: var(--pink-accent);
        }

        .calendar-header h3 {
            margin: 0;
            color: var(--pink-accent);
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .calendar-days-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 800;
            color: var(--rind-green);
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            transition: background-color 0.2s, border 0.2s;
            border: 2px solid transparent;
        }

        .calendar-day:hover {
            border-color: var(--pink-accent);
            background-color: var(--light-pink);
        }

        .calendar-day.active {
            background-color: var(--pink-accent);
            color: var(--white);
            border-color: var(--rind-green);
            transform: scale(1.05);
        }

        .calendar-day.empty {
            cursor: default;
            pointer-events: none;
        }

        .cal-dots-container {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            justify-content: center;
            padding: 0 4px;
            margin-top: 4px;
        }

        .cal-task-dot {
            width: 6px;
            height: 6px;
            background-color: var(--seed-black);
            border-radius: 50% 50% 50% 0; 
            transform: rotate(45deg);
        }

        .calendar-day.active .cal-task-dot {
            background-color: var(--white);
        }

        /* --- MAIN CONTAINER STYLES --- */
        .container {
            background-color: var(--white);
            width: 100%;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(43, 147, 72, 0.2);
            border: 3px solid var(--pink-accent);
            position: relative;
        }

        .mascot {
            width: 80px;
            display: block;
            margin: -70px auto 10px auto; 
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.15)); 
            animation: float 3s ease-in-out infinite;
            image-rendering: pixelated; 
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        h1 {
            text-align: center;
            color: var(--pink-accent);
            margin-top: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .today-badge {
            display: inline-block;
            background-color: var(--rind-light);
            color: #1e7033;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 10px;
            margin-left: 8px;
            vertical-align: middle;
            letter-spacing: 0.5px;
        }

        /* --- WATERMELON POMODORO TIMER --- */
        .pomodoro-container {
            background-color: var(--pink-accent);
            border: 4px solid var(--rind-green);
            border-bottom-width: 14px;
            border-radius: 150px 150px 30px 30px; 
            padding: 45px 20px 25px 20px;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            transition: background-color 0.4s, border-color 0.4s;
            box-shadow: inset 0 -8px 0 0 var(--rind-light), 0 8px 15px rgba(0,0,0,0.05);
            background-image: 
                radial-gradient(ellipse 6px 9px at 15% 40%, var(--seed-black) 40%, transparent 50%), 
                radial-gradient(ellipse 6px 9px at 85% 37%, var(--seed-black) 40%, transparent 50%), 
                radial-gradient(ellipse 6px 9px at 20% 65%, var(--seed-black) 40%, transparent 50%), 
                radial-gradient(ellipse 6px 9px at 80% 65%, var(--seed-black) 40%, transparent 50%)
        }

        .pomodoro-container.break-mode {
            background-color: var(--rind-light);
            border-color: var(--rind-green);
            background-image: none;
            box-shadow: inset 0 -8px 0 0 var(--white), 0 8px 15px rgba(0,0,0,0.05);
        }

        .timer-display {
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--white);
            margin: 5px 0;
            font-variant-numeric: tabular-nums;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.15);
            letter-spacing: 2px;
        }

        .break-mode .timer-display {
            color: var(--rind-green);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
        }

        .mode-text {
            font-weight: 800;
            color: var(--white);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1rem;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.15);
        }

        .break-mode .mode-text { color: var(--rind-green); text-shadow: none; }

        .pomodoro-controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }

        .pomodoro-controls button {
            background-color: var(--seed-black);
            color: var(--white);
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 0px rgba(0,0,0,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .pomodoro-controls button:active { transform: translateY(4px); box-shadow: 0 0px 0px rgba(0,0,0,0.4); }
        .break-mode .pomodoro-controls button { background-color: var(--rind-green); box-shadow: 0 4px 0px rgba(23, 78, 38, 0.4); }
        .break-mode .pomodoro-controls button:active { box-shadow: 0 0px 0px rgba(23, 78, 38, 0.4); }

        .progress-container {
            width: 100%;
            background-color: #f0f0f0;
            border-radius: 20px;
            margin-bottom: 25px;
            height: 25px;
            overflow: hidden;
            border: 2px solid var(--rind-green);
        }

        .progress-bar { height: 100%; background-color: var(--pink-accent); width: 0%; transition: width 0.4s ease; }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1; padding: 12px 15px; border: 2px solid var(--mint-bg);
            border-radius: 15px; font-size: 1rem; font-family: inherit; outline: none; transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: var(--rind-green); }
        select { padding: 12px; border: 2px solid var(--mint-bg); border-radius: 15px; font-family: inherit; outline: none; background: var(--white); }

        .add-btn {
            background-color: var(--rind-green); color: white; border: none; padding: 12px 20px;
            border-radius: 15px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: transform 0.1s, background-color 0.3s;
        }
        .add-btn:active { transform: scale(0.95); }
        .add-btn:hover { background-color: #1e7033; }

        .category-title { color: var(--rind-green); border-bottom: 2px dashed var(--mint-bg); padding-bottom: 5px; margin-top: 25px; }
        .task-list { list-style: none; padding: 0; margin: 0; }
        .task-item { display: flex; align-items: center; padding: 12px 10px; border-bottom: 1px solid #f0f0f0; transition: all 0.3s ease; border-radius: 10px; flex-wrap: wrap; }
        .task-item.in-progress { background-color: var(--light-pink); border-left: 4px solid var(--pink-accent); transform: scale(1.02); box-shadow: 0 4px 10px rgba(255, 143, 163, 0.2); }
        .task-item.completed span.task-text { text-decoration: line-through; color: #aaa; }
        .task-item.completed.in-progress { background-color: transparent; border-left: none; transform: scale(1); box-shadow: none; }

        .seed-checkbox {
            appearance: none; -webkit-appearance: none; width: 20px; height: 20px;
            background-color: var(--seed-black); border-radius: 50% 50% 50% 0; transform: rotate(45deg); margin-right: 15px; cursor: pointer; transition: background-color 0.3s; flex-shrink: 0;
        }
        .seed-checkbox:checked { background-color: var(--pink-accent); }
        .task-text { flex: 1; font-size: 1.1rem; min-width: 150px; }
        .focus-indicator { font-size: 0.85rem; color: var(--pink-accent); font-style: italic; margin-left: 8px; opacity: 0; transition: opacity 0.3s; font-weight: bold; }
        .task-item.in-progress .focus-indicator { opacity: 1; }
        .action-btn { background-color: transparent; color: #999; padding: 5px 8px; font-size: 1.1rem; margin-left: 5px; border: none; cursor: pointer; }
        .action-btn:hover { color: var(--pink-accent); }

        .empty-tasks-hint {
            text-align: center;
            color: #bbb;
            font-size: 0.9rem;
            font-style: italic;
            padding: 8px 0;
        }

        /* --- MOBILE RESPONSIVE STYLES --- */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .app-wrapper { flex-direction: column; align-items: center; gap: 15px; }
            .sidebar { width: 100%; max-width: 540px; }
            .container { padding: 20px 15px; border-radius: 20px; margin-top: 40px; }
            .mascot { width: 70px; margin-top: -55px; }
            h1 { font-size: 1.8rem; }
            .timer-display { font-size: 3.5rem; }
            .pomodoro-container { border-radius: 120px 120px 25px 25px; padding: 35px 15px 20px 15px; }
            .input-group { flex-direction: column; }
            input[type="text"], select, .add-btn { width: 100%; }
            .pomodoro-controls button { padding: 10px 15px; }
            .task-text { font-size: 1rem; }
            .auth-screen { margin: 60px auto; }
        }
    </style>
</head>

              <rect x="6" y="48" width="6" height="6" fill="var(--rind-green)"/><rect x="12" y="48" width="6" height="6" fill="var(--pink-accent)"/><rect x="18" y="48" width="6" height="6" fill="var(--pink-accent)"/><rect x="24" y="48" width="6" height="6" fill="var(--pink-accent)"/><rect x="30" y="48" width="6" height="6" fill="var(--pink-accent)"/><rect x="36" y="48" width="6" height="6" fill="var(--pink-accent)"/><rect x="42" y="48" width="6" height="6" fill="var(--pink-accent)"/><rect x="48" y="48" width="6" height="6" fill="var(--pink-accent)"/><rect x="54" y="48" width="6" height="6" fill="var(--pink-accent)"/><rect x="60" y="48" width="6" height="6" fill="var(--seed-black)"/><rect x="66" y="48" width="6" height="6" fill="var(--pink-accent)"/><rect x="72" y="48" width="6" height="6" fill="var(--rind-green)"/>
              <rect x="6" y="54" width="6" height="6" fill="var(--rind-green)"/><rect x="12" y="54" width="6" height="6" fill="var(--rind-light)"/><rect x="18" y="54" width="6" height="6" fill="var(--pink-accent)"/><rect x="24" y="54" width="6" height="6" fill="var(--seed-black)"/><rect x="30" y="54" width="6" height="6" fill="var(--pink-accent)"/><rect x="36" y="54" width="6" height="6" fill="var(--pink-accent)"/><rect x="42" y="54" width="6" height="6" fill="var(--seed-black)"/><rect x="48" y="54" width="6" height="6" fill="var(--pink-accent)"/><rect x="54" y="54" width="6" height="6" fill="var(--pink-accent)"/><rect x="60" y="54" width="6" height="6" fill="var(--pink-accent)"/><rect x="66" y="54" width="6" height="6" fill="var(--rind-light)"/><rect x="72" y="54" width="6" height="6" fill="var(--rind-green)"/>
              <rect x="6" y="60" width="6" height="6" fill="var(--rind-green)"/><rect x="12" y="60" width="6" height="6" fill="var(--rind-green)"/><rect x="18" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="24" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="30" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="36" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="42" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="48" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="54" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="60" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="66" y="60" width="6" height="6" fill="var(--rind-green)"/><rect x="72" y="60" width="6" height="6" fill="var(--rind-green)"/>
              <rect x="12" y="66" width="6" height="6" fill="var(--rind-green)"/><rect x="18" y="66" width="6" height="6" fill="var(--rind-green)"/><rect x="24" y="66" width="6" height="6" fill="var(--rind-light)"/><rect x="30" y="66" width="6" height="6" fill="var(--pink-accent)"/><rect x="36" y="66" width="6" height="6" fill="var(--pink-accent)"/><rect x="42" y="66" width="6" height="6" fill="var(--pink-accent)"/><rect x="48" y="66" width="6" height="6" fill="var(--pink-accent)"/><rect x="54" y="66" width="6" height="6" fill="var(--rind-light)"/><rect x="60" y="66" width="6" height="6" fill="var(--rind-green)"/><rect x="66" y="66" width="6" height="6" fill="var(--rind-green)"/>
              <rect x="18" y="72" width="6" height="6" fill="var(--rind-green)"/><rect x="24" y="72" width="6" height="6" fill="var(--rind-green)"/><rect x="30" y="72" width="6" height="6" fill="var(--rind-green)"/><rect x="36" y="72" width="6" height="6" fill="var(--rind-light)"/><rect x="42" y="72" width="6" height="6" fill="var(--rind-light)"/><rect x="48" y="72" width="6" height="6" fill="var(--rind-green)"/><rect x="54" y="72" width="6" height="6" fill="var(--rind-green)"/><rect x="60" y="72" width="6" height="6" fill="var(--rind-green)"/>
              <rect x="36" y="78" width="6" height="6" fill="var(--rind-green)"/><rect x="42" y="78" width="6" height="6" fill="var(--rind-green)"/>

        <pattern id="melonBack" patternUnits="userSpaceOnUse" width="150" height="150">
          <use href="#melonIcon" x="20" y="20" width="84" height="84" opacity="0.4"/>
          <animateTransform attributeName="patternTransform" type="translate"
            values="0 0; 150 150" dur="22s" repeatCount="indefinite"/>

      <rect width="100%" height="100%" fill="var(--mint-bg)"/>

    <!-- LOADING STATE (shown while Firebase determines auth status) -->
    <div class="auth-loading" id="authLoading">🍉 Loading...</div>

    <!-- AUTH SCREEN (login / sign up) -->
    <div class="auth-screen" id="authScreen" style="display:none;">
        <h1 id="authTitle">🍉 Welcome Back</h1>
        <div class="auth-error" id="authError"></div>
        <input type="email" id="authEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
        <button class="auth-submit-btn" id="authSubmitBtn" onclick="handleAuthSubmit()">Log In</button>
        <div class="auth-toggle">
            <span id="authToggleText">Don't have an account?</span>
            <a onclick="toggleAuthMode()" id="authToggleLink">Sign up</a>
        </div>
    </div>

    <div class="app-wrapper" id="appWrapper">
        
        <!-- SIDEBAR CALENDAR -->
        <div class="sidebar">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">&#10094;</button>
                <h3 id="monthYearDisplay">Month Year</h3>
                <button onclick="changeMonth(1)">&#10095;</button>
            </div>
            <div class="calendar-days-header">
                <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            </div>
            <div id="calendarGrid" class="calendar-grid">
                <!-- Javascript will populate days here -->
            </div>
        </div>

        <!-- MAIN CONTAINER -->
        <div class="container">
            <div class="account-bar">
                <span class="account-email" id="accountEmail"></span>
                <button class="logout-btn" onclick="handleLogout()">Log Out</button>
            </div>

            <img src="watermelon-removebg-preview.png" alt="Cute Watermelon Mascot" class="mascot">
            
            <h1 id="mainTitle">🍉 Watermelon273 🍉</h1>

            <!-- POMODORO TIMER -->
            <div class="pomodoro-container" id="pomodoroContainer">
                <p class="mode-text" id="timerMode">Focus Time</p>
                <div class="timer-display" id="timerDisplay">25:00</div>
                <div class="pomodoro-controls">
                    <button id="timerBtn" onclick="toggleTimer()">▶ Start</button>
                    <button onclick="switchTimerMode()">🔄 Break</button>
                </div>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="input-group">
                <input type="text" id="taskInput" placeholder="What's next, champ?">
                <select id="categorySelect">
                    <option value="rind">The Rind (Tough)</option>
                    <option value="flesh">The Flesh (Core)</option>
                    <option value="seeds">The Seeds (Quick)</option>
                </select>
                <button class="add-btn" onclick="addTask()">Add</button>
            </div>

            <h3 class="category-title">The Rind (Tough Tasks)</h3>
            <ul class="task-list" id="rindList"></ul>

            <h3 class="category-title">The Flesh (Core Tasks)</h3>
            <ul class="task-list" id="fleshList"></ul>

            <h3 class="category-title">The Seeds (Quick Wins)</h3>
            <ul class="task-list" id="seedsList"></ul>
        </div>

    </div>

    <script type="module">
        // --- FIREBASE SETUP ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import {
            getFirestore,
            collection,
            doc,
            addDoc,
            updateDoc,
            deleteDoc,
            onSnapshot,
            query,
            writeBatch
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJH73MGfHld23zzOWjVp2wdK0IV1BvVGg",
            authDomain: "watermelon-273.firebaseapp.com",
            projectId: "watermelon-273",
            storageBucket: "watermelon-273.firebasestorage.app",
            messagingSenderId: "744401727991",
            appId: "1:744401727991:web:985a9ccb41df61895cfef2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- GLOBAL STATE ---
        function formatDateStr(year, month, day) {
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }
        function todayDateStr() {
            const now = new Date();
            return formatDateStr(now.getFullYear(), now.getMonth(), now.getDate());
        }

        let tasks = [];
        let selectedDate = todayDateStr(); // Always a real date now — no more "General" view
        let currentUser = null;
        let unsubscribeTasks = null;
        let isSignUpMode = false;

        // --- AUTH UI ---
        const authLoading = document.getElementById('authLoading');
        const authScreen = document.getElementById('authScreen');
        const appWrapper = document.getElementById('appWrapper');
        const authError = document.getElementById('authError');
        const authTitle = document.getElementById('authTitle');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const authToggleText = document.getElementById('authToggleText');
        const authToggleLink = document.getElementById('authToggleLink');
        const accountEmail = document.getElementById('accountEmail');

        window.toggleAuthMode = function () {
            isSignUpMode = !isSignUpMode;
            authError.innerText = '';
            if (isSignUpMode) {
                authTitle.innerText = '🍉 Join Watermelon273';
                authSubmitBtn.innerText = 'Sign Up';
                authToggleText.innerText = 'Already have an account?';
                authToggleLink.innerText = 'Log in';
            } else {
                authTitle.innerText = '🍉 Welcome Back';
                authSubmitBtn.innerText = 'Log In';
                authToggleText.innerText = "Don't have an account?";
                authToggleLink.innerText = 'Sign up';
            }
        };

        window.handleAuthSubmit = async function () {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            authError.innerText = '';

            if (!email || !password) {
                authError.innerText = 'Please enter an email and password.';
                return;
            }

            authSubmitBtn.disabled = true;
            authSubmitBtn.innerText = isSignUpMode ? 'Signing up...' : 'Logging in...';

            try {
                if (isSignUpMode) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
                // onAuthStateChanged picks up from here
            } catch (err) {
                authError.innerText = friendlyAuthError(err.code);
            } finally {
                authSubmitBtn.disabled = false;
                authSubmitBtn.innerText = isSignUpMode ? 'Sign Up' : 'Log In';
            }
        };

        window.handleLogout = async function () {
            await signOut(auth);
        };

        function friendlyAuthError(code) {
            switch (code) {
                case 'auth/email-already-in-use': return 'That email is already registered. Try logging in.';
                case 'auth/invalid-email': return 'That email address looks invalid.';
                case 'auth/weak-password': return 'Password should be at least 6 characters.';
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential': return 'Incorrect email or password.';
                default: return "Something went wrong. Give it another try.";
            }
        }

        // --- AUTH STATE LISTENER ---
        onAuthStateChanged(auth, (user) => {
            authLoading.style.display = 'none';

            if (unsubscribeTasks) {
                unsubscribeTasks();
                unsubscribeTasks = null;
            }

            if (user) {
                currentUser = user;
                authScreen.style.display = 'none';
                appWrapper.style.display = 'flex';
                accountEmail.innerText = user.email;
                subscribeToTasks(user.uid);
            } else {
                currentUser = null;
                tasks = [];
                appWrapper.style.display = 'none';
                authScreen.style.display = 'block';
                document.getElementById('authEmail').value = '';
                document.getElementById('authPassword').value = '';
            }
        });

        // --- FIRESTORE TASK SYNC ---
        function subscribeToTasks(uid) {
            const tasksRef = collection(db, 'users', uid, 'tasks');
            unsubscribeTasks = onSnapshot(query(tasksRef), (snapshot) => {
                tasks = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTasks();
                renderCalendar();
                updateProgress();
            }, (err) => {
                console.error('Task sync error:', err);
            });
        }

        // --- CALENDAR LOGIC ---
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const monthYearDisplay = document.getElementById('monthYearDisplay');
            grid.innerHTML = '';
            
            monthYearDisplay.innerText = `${monthNames[currentMonth]} ${currentYear}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'calendar-day empty';
                grid.appendChild(emptyDiv);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                dayDiv.innerText = i;
                
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                if (dateStr === selectedDate) {
                    dayDiv.classList.add('active');
                }
                
                dayDiv.onclick = () => selectDate(dateStr);

                const dayTasks = tasks.filter(t => t.date === dateStr);
                
                if (dayTasks.length > 0) {
                    const dotsContainer = document.createElement('div');
                    dotsContainer.className = 'cal-dots-container';
                    
                    dayTasks.forEach(t => {
                        const dot = document.createElement('div');
                        dot.className = 'cal-task-dot';
                        if (t.completed) {
                            dot.style.backgroundColor = 'var(--rind-green)';
                        }
                        dotsContainer.appendChild(dot);
                    });
                    dayDiv.appendChild(dotsContainer);
                }

                grid.appendChild(dayDiv);
            }
        }

        window.changeMonth = function (direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        };

        window.selectDate = function (dateStr) {
            selectedDate = dateStr;
            renderCalendar();
            renderTasks();
            updateProgress();
        };

        function formatFriendlyDate(dateStr) {
            const parts = dateStr.split('-');
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            return `${monthNames[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
        }

        // --- POMODORO LOGIC ---
        let timerTime = 25 * 60; 
        let timerInterval = null;
        let isFocusMode = true;

        function updateTimerDisplay() {
            const mins = Math.floor(timerTime / 60).toString().padStart(2, '0');
            const secs = (timerTime % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }

        window.toggleTimer = function () {
            const btn = document.getElementById('timerBtn');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.innerText = '▶ Start';
            } else {
                timerInterval = setInterval(() => {
                    if (timerTime > 0) {
                        timerTime--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        alert(isFocusMode ? "Time for a break! 🍉" : "Break is over, back to it! 🍉");
                        switchTimerMode();
                    }
                }, 1000);
                btn.innerText = '⏸ Pause';
            }
        };

        window.switchTimerMode = function () {
            isFocusMode = !isFocusMode;
            timerTime = isFocusMode ? 25 * 60 : 5 * 60;
            
            const container = document.getElementById('pomodoroContainer');
            const modeText = document.getElementById('timerMode');
            
            if (isFocusMode) {
                container.classList.remove('break-mode');
                modeText.innerText = 'Focus Time';
            } else {
                container.classList.add('break-mode');
                modeText.innerText = 'Break Time';
            }
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('timerBtn').innerText = '▶ Start';
            
            updateTimerDisplay();
        };

        // --- TASK LIST LOGIC (Firestore-backed) ---
        window.addTask = async function () {
            if (!currentUser) return;
            const input = document.getElementById('taskInput');
            const category = document.getElementById('categorySelect').value;
            const text = input.value.trim();
            
            if (text !== '') {
                input.value = '';
                try {
                    await addDoc(collection(db, 'users', currentUser.uid, 'tasks'), {
                        text: text,
                        category: category,
                        completed: false,
                        inProgress: false,
                        date: selectedDate
                    });
                } catch (err) {
                    console.error('Add task failed:', err);
                    alert('Could not add task. Please try again.');
                }
            }
        };

        window.toggleTask = async function (id) {
            if (!currentUser) return;
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            try {
                await updateDoc(doc(db, 'users', currentUser.uid, 'tasks', id), {
                    completed: !task.completed,
                    inProgress: false
                });
            } catch (err) {
                console.error('Toggle task failed:', err);
            }
        };

        window.toggleInProgress = async function (id) {
            if (!currentUser) return;
            const target = tasks.find(t => t.id === id);
            if (!target) return;

            try {
                const batch = writeBatch(db);
                const newValue = !target.inProgress;

                tasks.forEach(t => {
                    if (t.id === id) {
                        batch.update(doc(db, 'users', currentUser.uid, 'tasks', t.id), { inProgress: newValue });
                    } else if (t.inProgress) {
                        batch.update(doc(db, 'users', currentUser.uid, 'tasks', t.id), { inProgress: false });
                    }
                });

                await batch.commit();
            } catch (err) {
                console.error('Focus toggle failed:', err);
            }
        };

        window.deleteTask = async function (id) {
            if (!currentUser) return;
            try {
                await deleteDoc(doc(db, 'users', currentUser.uid, 'tasks', id));
            } catch (err) {
                console.error('Delete task failed:', err);
            }
        };

        function updateProgress() {
            const visibleTasks = tasks.filter(t => t.date === selectedDate);
            const total = visibleTasks.length;
            const completed = visibleTasks.filter(t => t.completed).length;
            const percentage = total === 0 ? 0 : (completed / total) * 100;
            
            document.getElementById('progressBar').style.width = percentage + '%';
            
            if (percentage === 100 && total > 0) {
                setTimeout(() => alert("You're one in a melon! All tasks done! 🍉"), 300);
            }
        }

        function renderTasks() {
            const tasksToRender = tasks.filter(t => t.date === selectedDate);

            const mainTitle = document.getElementById('mainTitle');
            const isToday = selectedDate === todayDateStr();
            mainTitle.innerHTML = `🍉 ${formatFriendlyDate(selectedDate)} 🍉${isToday ? '<span class="today-badge">Today</span>' : ''}`;

            const lists = {
                rind: document.getElementById('rindList'),
                flesh: document.getElementById('fleshList'),
                seeds: document.getElementById('seedsList')
            };

            Object.values(lists).forEach(list => list.innerHTML = '');

            tasksToRender.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''} ${task.inProgress ? 'in-progress' : ''}`;
                
                li.innerHTML = `
                    <input type="checkbox" class="seed-checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask('${task.id}')">
                    <span class="task-text">
                        ${task.text}
                        <span class="focus-indicator">🍉 (focusing)</span>
                    </span>
                    <button class="action-btn" onclick="toggleInProgress('${task.id}')" title="Focus on this task">
                        ${task.inProgress ? '⏸' : '▶'}
                    </button>
                    <button class="action-btn" onclick="deleteTask('${task.id}')" title="Delete task">×</button>
                `;
                
                lists[task.category].appendChild(li);
            });
        }

        document.getElementById('taskInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        document.getElementById('authPassword').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleAuthSubmit();
            }
        });

        // Initial setup (calendar/timer UI can render before auth resolves)
        renderCalendar();
        updateTimerDisplay();
    </script>
