<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watermelon273</title>
<style>
  :root {
    --mint-bg: #A3BEFD;
    --pink-accent: #ff8fa3;
    --rind-green: #2b9348;
    --rind-light: #eaffea;
    --seed-black: #2c2c2c;
  }
  html, body {
    margin: 0;
    height: 100%;
    background-color: var(--mint-bg);
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
  }
  /* The animated background sits fixed behind everything */
  .watermelon-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .demo-note {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    color: #1e4620;
    font-weight: 800;
    font-size: 1.4rem;
    text-shadow: 0 2px 0 rgba(255,255,255,0.5);
    padding: 20px;
  }
</style>
</head>
<body>

  <svg class="watermelon-bg" preserveAspectRatio="xMidYMid slice">
    <defs>
      <symbol id="melonIcon" viewBox="0 0 84 84">
        <g shape-rendering="crispEdges">
            <rect x="36" y="0" width="6" height="6" fill="var(--rind-green)"/><rect x="42" y="0" width="6" height="6" fill="var(--rind-green)"/>

            <rect x="12" y="12" width="6" height="6" fill="var(--rind-green)"/><rect x="18" y="12" width="6" height="6" fill="var(--rind-green)"/><rect x="24" y="12" width="6" height="6" fill="var(--rind-light)"/><rect x="30" y="12" width="6" height="6" fill="var(--pink-accent)"/><rect x="36" y="12" width="6" height="6" fill="var(--pink-accent)"/><rect x="42" y="12" width="6" height="6" fill="var(--pink-accent)"/><rect x="48" y="12" width="6" height="6" fill="var(--pink-accent)"/><rect x="54" y="12" width="6" height="6" fill="var(--rind-light)"/><rect x="60" y="12" width="6" height="6" fill="var(--rind-green)"/><rect x="66" y="12" width="6" height="6" fill="var(--rind-green)"/>
            <rect x="6" y="18" width="6" height="6" fill="var(--rind-green)"/><rect x="12" y="18" width="6" height="6" fill="var(--rind-green)"/><rect x="18" y="18" width="6" height="6" fill="var(--pink-accent)"/><rect x="24" y="18" width="6" height="6" fill="var(--pink-accent)"/><rect x="30" y="18" width="6" height="6" fill="var(--pink-accent)"/><rect x="36" y="18" width="6" height="6" fill="var(--pink-accent)"/><rect x="42" y="18" width="6" height="6" fill="var(--pink-accent)"/><rect x="48" y="18" width="6" height="6" fill="var(--pink-accent)"/><rect x="54" y="18" width="6" height="6" fill="var(--pink-accent)"/><rect x="60" y="18" width="6" height="6" fill="var(--pink-accent)"/><rect x="66" y="18" width="6" height="6" fill="var(--rind-green)"/><rect x="72" y="18" width="6" height="6" fill="var(--rind-green)"/>

            <rect x="0" y="42" width="6" height="6" fill="var(--rind-green)"/><rect x="6" y="42" width="6" height="6" fill="var(--rind-light)"/><rect x="12" y="42" width="6" height="6" fill="var(--pink-accent)"/><rect x="18" y="42" width="6" height="6" fill="var(--seed-black)"/><rect x="24" y="42" width="6" height="6" fill="var(--pink-accent)"/><rect x="30" y="42" width="6" height="6" fill="var(--pink-accent)"/><rect x="36" y="42" width="6" height="6" fill="var(--pink-accent)"/><rect x="42" y="42" width="6" height="6" fill="var(--pink-accent)"/><rect x="48" y="42" width="6" height="6" fill="var(--pink-accent)"/><rect x="54" y="42" width="6" height="6" fill="var(--pink-accent)"/><rect x="60" y="42" width="6" height="6" fill="var(--pink-accent)"/><rect x="66" y="42" width="6" height="6" fill="var(--pink-accent)"/><rect x="72" y="42" width="6" height="6" fill="var(--rind-light)"/><rect x="78" y="42" width="6" height="6" fill="var(--rind-green)"/>

            <rect x="6" y="54" width="6" height="6" fill="var(--rind-green)"/><rect x="12" y="54" width="6" height="6" fill="var(--rind-light)"/><rect x="18" y="54" width="6" height="6" fill="var(--pink-accent)"/><rect x="24" y="54" width="6" height="6" fill="var(--seed-black)"/><rect x="30" y="54" width="6" height="6" fill="var(--pink-accent)"/><rect x="36" y="54" width="6" height="6" fill="var(--pink-accent)"/><rect x="42" y="54" width="6" height="6" fill="var(--seed-black)"/><rect x="48" y="54" width="6" height="6" fill="var(--pink-accent)"/><rect x="54" y="54" width="6" height="6" fill="var(--pink-accent)"/><rect x="60" y="54" width="6" height="6" fill="var(--pink-accent)"/><rect x="66" y="54" width="6" height="6" fill="var(--rind-light)"/><rect x="72" y="54" width="6" height="6" fill="var(--rind-green)"/>
            <rect x="6" y="60" width="6" height="6" fill="var(--rind-green)"/><rect x="12" y="60" width="6" height="6" fill="var(--rind-green)"/><rect x="18" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="24" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="30" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="36" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="42" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="48" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="54" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="60" y="60" width="6" height="6" fill="var(--pink-accent)"/><rect x="66" y="60" width="6" height="6" fill="var(--rind-green)"/><rect x="72" y="60" width="6" height="6" fill="var(--rind-green)"/>

        </g>
      </symbol>

      <!-- Big watermelon layer, slow diagonal drift -->
      <pattern id="melonBack" patternUnits="userSpaceOnUse" width="150" height="150">
        <use href="#melonIcon" x="20" y="20" width="84" height="84" opacity="0.4"/>
        <animateTransform attributeName="patternTransform" type="translate"
          values="0 0; 150 150" dur="34s" repeatCount="indefinite"/>
      </pattern>
    </defs>

    <rect width="100%" height="100%" fill="var(--mint-bg)"/>
    <rect width="100%" height="100%" fill="url(#melonBack)"/>
  </svg>

  <div class="demo-note"></div>

</body>
</html>
